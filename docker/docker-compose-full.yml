include:
    - docker-compose-base.yml

services:
    spring-boot-demo-app:
        container_name: spring_boot_demo_app
        image: spring-boot-demo-app:latest
        environment:
            - SPRING_PROFILES_ACTIVE=docker
        ports:
            - "8080:8080"
            - "8085:8085"
        restart: unless-stopped
        depends_on:
            jaeger:
                condition: service_started
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 512M
        networks:
            - jaeger-example

    spring-boot-demo-app-kotlin:
        container_name: spring_boot_demo_app_kotlin
        image: spring-boot-demo-app-kotlin:latest
        environment:
            - SPRING_PROFILES_ACTIVE=docker
        ports:
            - "8090:8090"
            - "8091:8091"
        restart: unless-stopped
        depends_on:
            jaeger:
                condition: service_started
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 512M
        networks:
            - jaeger-example

    spring-boot-demo-app-reactive:
        container_name: spring_boot_demo_app_reactive
        image: spring-boot-demo-app-reactive:latest
        environment:
            - SPRING_PROFILES_ACTIVE=docker
        ports:
            - "8086:8086"
            - "8087:8087"
        restart: unless-stopped
        depends_on:
            jaeger:
                condition: service_started
        deploy:
            resources:
                limits:
                    cpus: '0.5'
                    memory: 512M
        networks:
            - jaeger-example
