[versions]
detekt = "2.0.0-alpha.6"
spring-boot-v4 = "4.0.9"

[libraries]
detekt = { group = "dev.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
detekt-ktlint = { group = "dev.detekt", name = "detekt-rules-ktlint-wrapper", version.ref = "detekt" }
detekt-libraries = { group = "dev.detekt", name = "detekt-rules-libraries", version.ref = "detekt" }
spring-boot-v4-dependencies = { group = "org.springframework.boot", name = "spring-boot-dependencies", version.ref = "spring-boot-v4" }
springdoc-openapi = "org.springdoc:springdoc-openapi-bom:3.0.3"
wiremock-spring-boot = "org.wiremock.integrations:wiremock-spring-boot:4.4.3"
datasource-micrometer = "net.ttddyy.observation:datasource-micrometer-spring-boot:2.2.1"
logstash = "net.logstash.logback:logstash-logback-encoder:9.0"

[plugins]
spring-boot-v4 = { id = "org.springframework.boot", version.ref = "spring-boot-v4" }
